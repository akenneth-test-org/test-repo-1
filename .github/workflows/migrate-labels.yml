name: Issue Fields Migrator

on:
  # Triggered by issue comments
  issue_comment:
    types: [created]
  
  # Manual dispatch for testing
  workflow_dispatch:
    inputs:
      command:
        description: 'Command (analyze/preview/execute)'
        required: true
        default: 'analyze'
      repository:
        description: 'Target repository (owner/repo)'
        required: true
      issue_number:
        description: 'Issue number for posting results'
        required: true

jobs:
  migrate-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    # Only run if comment contains @issue-fields-migrator
    if: contains(github.event.comment.body, '@issue-fields-migrator') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Parse command from comment
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment?.body || '';
            const repo = context.payload.repository?.full_name || '${{ inputs.repository }}';
            const issueNumber = context.payload.issue?.number || '${{ inputs.issue_number }}';
            
            // Parse command
            let command = 'analyze';
            if (comment.includes('accept') || comment.includes('preview')) {
              command = 'preview';
            } else if (comment.includes('execute migration')) {
              command = 'execute';
            } else if (comment.includes('cancel')) {
              command = 'cancel';
            } else if (comment.includes('Map ') || comment.includes('map ')) {
              command = 'refine';
            }
            
            core.setOutput('command', command);
            core.setOutput('repository', repo);
            core.setOutput('issue_number', issueNumber);
            core.setOutput('comment_body', comment);
      
      - name: Run migration command
        id: migrate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMAND: ${{ steps.parse.outputs.command }}
          TARGET_REPO: ${{ steps.parse.outputs.repository }}
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          COMMENT_BODY: ${{ steps.parse.outputs.comment_body }}
        run: |
          node .github/scripts/run-migration.js
      
      - name: Post results as comment
        if: always() && steps.parse.outputs.command != 'cancel'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read result
            let result;
            try {
              result = JSON.parse(fs.readFileSync('migration-result.json', 'utf8'));
            } catch (error) {
              result = {
                success: false,
                message: `Error: ${error.message}`
              };
            }
            
            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.parse.outputs.issue_number }},
              body: result.message || JSON.stringify(result, null, 2)
            });
      
      - name: Handle cancel
        if: steps.parse.outputs.command == 'cancel'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.parse.outputs.issue_number }},
              body: '❌ Migration cancelled. No changes were made.'
            });

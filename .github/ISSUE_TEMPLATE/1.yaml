name: Bug Report
description: Report a bug or issue with this project
labels: bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: |
        Please provide as much info as possible. Not doing so may result in your bug not being addressed in a timely manner.
        If this matter is security related, please disclose it privately to the project maintainers.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it (as minimally and precisely as possible)?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Please provide details about your environment
      value: |
        <details>

        **Operating System:**
        <!-- e.g., Ubuntu 20.04, Windows 10, macOS 12.0 -->

        **Version/Commit:**
        <!-- Project version or commit hash -->

        **Additional Environment Details:**
        <!-- Any other relevant environment information -->

        </details>
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else we need to know?
      description: Add any other context about the problem here

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
